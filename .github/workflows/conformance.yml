# Runs the conformance checker's self-test, and builds its distribution.
#
# Separate from `validate.yml`, because the two answer different questions
# and the specification's own gate should not slow down or fail for a
# change to a tool beside it. `validate.py` asks whether SPEC.md, the
# schemas and the examples still agree; this asks whether the checker that
# reads them can still fail when a runner breaks a rule.
#
# The self-test is the part worth having in CI. A conformance checker's own
# failure mode is a false green — every check reads correctly and would
# have passed against a runner that implemented none of it — so the thing
# to protect is not that the checks pass, but that each one still catches
# the rule it was written for.
#
# No trigger-level `paths:` filter, even though `selftest`/`build` only
# matter for tools/conformance/** and schemas/**: a workflow gated at the
# trigger reports nothing for a PR outside those paths, so it can never be
# marked a required status check without leaving every other PR waiting on
# a status that never arrives. Path-sensitivity lives in the `changes` job
# instead, gating the two real jobs; `conformance-status` reports on every
# run regardless of what it skipped, which is the job safe to require.
name: conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

# A superseded push has nothing to say. Cancelling its run frees the runner
# for the commit that replaced it, and the only thing lost is a verdict on a
# tree nobody will merge.
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      conformance_changed: ${{ steps.filter.outputs.conformance_changed || steps.filter_fallback.outputs.conformance_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        continue-on-error: true
        with:
          filters: |
            conformance_changed:
              - 'tools/conformance/**'
              - 'schemas/**'
              - '.github/workflows/conformance.yml'

      # paths-filter above is continue-on-error, and an unhandled failure
      # fails open the wrong way: the output stays unset, `== 'true'` reads
      # false, and selftest/build silently skip on a run that should have
      # exercised them. Default to running both instead.
      - name: Fallback when paths-filter cannot determine changed files
        if: ${{ steps.filter.outcome == 'failure' }}
        id: filter_fallback
        run: |
          echo "paths-filter failed; defaulting to conservative full checks."
          echo "conformance_changed=true" >> "$GITHUB_OUTPUT"

  selftest:
    needs: changes
    if: needs.changes.outputs.conformance_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `pyproject.toml` declares, and current. A checker an
        # implementer cannot install is one they will not use, and the
        # floor is only a claim until something runs on it.
        python-version: ['3.10', '3.13']
    steps:
      # Installed rather than run from source, so the packaging is exercised
      # by the same step that exercises the checks. A dependency missing
      # from `pyproject.toml` fails here rather than on someone's machine.
      - uses: sigrix-io/actions/setup-python-project@765103f1c9d89e019dcaea72a78eed2577b30ae1 # v1.0.0
        with:
          python-version: ${{ matrix.python-version }}
          install: ./tools/conformance

      # The self-test needs the fake runner beside it, which the install
      # does not place — it is a test fixture, not part of the package.
      - run: python tools/conformance/selftest.py

      # Standard library only, no runner, no network: a smoke test that the
      # console script the wheel declares actually resolves.
      - run: postern-conformance --version

  build:
    needs: changes
    if: needs.changes.outputs.conformance_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: sigrix-io/actions/setup-python-project@765103f1c9d89e019dcaea72a78eed2577b30ae1 # v1.0.0
        with:
          python-version: '3.12'
          install: build twine

      - run: python -m build --outdir dist tools/conformance

      # `twine check` reads the metadata the way PyPI will, so a README
      # that renders badly is caught before an upload that cannot be
      # replaced — a version number on PyPI is spent whether or not the
      # page is legible.
      - run: python -m twine check dist/*

      # Proves the wheel carries the schemas. Installed into a directory
      # with no repository around it, which is the case the bundled copy
      # exists for and the one a checkout can never exercise: run from a
      # checkout, the checker reads the checkout's own schemas.
      - name: The wheel works with no checkout around it
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheeltest/bin/postern-conformance --version
          /tmp/wheeltest/bin/python -c "
          from postern_conformance import schemas
          directory, source = schemas.schema_source()
          assert source == 'bundled with this package', source
          for name in schemas.SCHEMA_FILENAMES:
              assert schemas.load(name)['\$id'], name
          print(f'{len(schemas.SCHEMA_FILENAMES)} schemas readable from the wheel')
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postern-conformance-dist
          path: dist/

  conformance-status:
    name: conformance-status
    needs: [changes, selftest, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          SELFTEST: ${{ needs.selftest.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes=$CHANGES selftest=$SELFTEST build=$BUILD"
          for r in "$CHANGES" "$SELFTEST" "$BUILD"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not pass (result: $r)."
              exit 1
            fi
          done
          echo "All CI jobs passed or were safely skipped."
